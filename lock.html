<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chrome is locked</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid; place-items: center;
      background: radial-gradient(1200px 600px at 50% -10%, #24304a, #0d1017 60%);
      font: 15px/1.5 system-ui, 'Segoe UI', Roboto, sans-serif; color: #e8ecf4;
      user-select: none;
    }
    .card {
      width: 380px; padding: 34px; border-radius: 18px; text-align: center;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09);
      box-shadow: 0 24px 60px rgba(0,0,0,.55);
    }
    .lock { font-size: 40px; line-height: 1; }
    h1 { font-size: 19px; margin: 14px 0 4px; }
    p.sub { margin: 0 0 22px; color: #9aa5b8; font-size: 13px; }
    input {
      width: 100%; padding: 13px 14px; margin-bottom: 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.35);
      color: #fff; font-size: 16px; text-align: center; outline: none; user-select: text;
    }
    input:focus { border-color: #6d8cff; }
    button {
      width: 100%; padding: 13px; border: 0; border-radius: 10px; cursor: pointer;
      background: #4f7cff; color: #fff; font-size: 15px; font-weight: 600;
    }
    button:hover { background: #3f6bee; }
    button:disabled { background: #33405e; cursor: default; }
    .err { min-height: 20px; margin-top: 12px; color: #ff8085; font-size: 13px; }
    .link { margin-top: 10px; font-size: 13px; }
    .link button { background: #2b3450; }
  </style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <div class="lock">&#128274;</div>
    <h1 id="title">Chrome is locked</h1>
    <p class="sub" id="sub">Enter password to continue</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="off" autofocus>
    <button type="submit" id="go">Unlock</button>
    <div class="err" id="err"></div>
    <div class="link" id="setupLink" style="display:none">
      <button type="button" id="openOpts">Open settings</button>
    </div>
  </form>
  <script src="lock.js"></script>
</body>
</html>
